name: RangerEpic PR checks

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check admin server syntax
        run: npm run check:admin

      - name: Test Gameplay V1 rules
        run: npm run test:gameplay-v1

      - name: Test player roster and save migration
        run: npm run test:player-roster

      - name: Test enemy and multi-wave stage data
        run: npm run test:adventure

      - name: Build admin editor
        run: npm run build:admin

      - name: Build play-only site
        run: npm run build:play -- --base=/rangerepic/

      - name: Prepare GitHub Pages paths
        env:
          PAGES_BASE_PATH: /rangerepic/
        run: node scripts/prepare-github-pages.mjs

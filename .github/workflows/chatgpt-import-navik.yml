name: ChatGPT import Navik base

on:
  push:
    branches:
      - navik-base

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rebuild and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .chatgpt-import/chunk-* > /tmp/archive.b64
          base64 -d /tmp/archive.b64 > /tmp/LineRanger_TurnBased.tar.gz
          echo "d9a60243de6845da0a39f1089ae766ef292d3a08b1fcae345331149159ca265d  /tmp/LineRanger_TurnBased.tar.gz" | sha256sum -c -

      - name: Replace repository working tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/LineRanger_TurnBased.tar.gz -C .

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: replace rangerepic with Navik LineRanger_TurnBased base"
          git push origin HEAD:navik-base

name: Deploy Ranger Epic to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-vite"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check admin server syntax
        run: npm run check:admin

      - name: Test Gameplay V1 rules
        run: npm run test:gameplay-v1

      - name: Build admin editor
        run: npm run build:admin

      - name: Build play-only site
        run: npm run build:play -- --base=/rangerepic/

      - name: Prepare GitHub Pages paths
        env:
          PAGES_BASE_PATH: /rangerepic/
        run: node scripts/prepare-github-pages.mjs

      - name: Wait for branch Pages deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..60}; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20" --jq '.workflow_runs[] | select(.name=="pages build and deployment" and .event=="dynamic") | .status' | head -n 1)"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20" --jq '.workflow_runs[] | select(.name=="pages build and deployment" and .event=="dynamic") | .conclusion' | head -n 1)"
            echo "branch Pages status=${status:-not-found} conclusion=${conclusion:-none}"
            if [ "$status" = "completed" ]; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for branch Pages deployment" >&2
              exit 1
            fi
            sleep 3
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-play

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
